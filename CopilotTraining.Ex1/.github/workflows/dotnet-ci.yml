name: .NET CI
on: push: branches: [ main, master, 'copilot-training/*' ] pull_request: branches: [ main, master ]
jobs: build-and-test: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4
  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'

  - name: Restore
    run: dotnet restore

  - name: Build
    run: dotnet build --no-restore --configuration Release

  - name: Test
    run: dotnet test --no-build --configuration Release --verbosity normal

  - name: Install dotnet-format
    run: |
      dotnet tool install -g dotnet-format --version 6.*
      echo "::add-path::$HOME/.dotnet/tools"
    shell: bash

  - name: Check code format
    run: |
      export PATH="$PATH:$HOME/.dotnet/tools"
      dotnet format --verify-no-changes
    shell: bash